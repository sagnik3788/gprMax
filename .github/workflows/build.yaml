name: Build and Verify

on:
  push:
    branches: [ feature/cicd-automation ]
  # pull_request:
  #   branches: [ devel ]

jobs:
  build-cpu:
    name: CPU Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x .ci/cpu/build_cpu.sh
          bash .ci/cpu/build_cpu.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: .ci\cpu\built_win.bat
